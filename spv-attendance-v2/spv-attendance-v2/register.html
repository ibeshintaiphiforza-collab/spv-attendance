<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Anggota - SPV Attendance</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <!-- Pustaka Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-slate-800">SAINT PAUL VOICES</h1>
            <p class="text-sm text-slate-500 mt-1">Pendaftaran Anggota Baru (Supabase)</p>
        </div>

        <form id="formRegister" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nomor Induk Siswa (NIS)</label>
                <input type="text" id="regNis" required 
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Contoh: 12345">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nama Lengkap</label>
                <input type="text" id="regNama" required 
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Nama lengkap & panggilan">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Jenis Suara</label>
                <select id="regSuara" class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="Soprano">Soprano</option>
                    <option value="Alto">Alto</option>
                    <option value="Tenor">Tenor</option>
                    <option value="Bass">Bass</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                <input type="password" id="regPassword" required 
                    class="w-full px-4 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Buat password akun">
            </div>

            <button type="submit" id="btnRegister"
                class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg mt-2">
                Daftar ke Database
            </button>
        </form>

        <div class="mt-4 text-center">
            <p class="text-sm text-slate-600">Sudah punya akun? <a href="index.html" class="text-indigo-600 font-semibold hover:underline">Login di sini</a></p>
        </div>

        <div id="pesanInfo" class="mt-4 text-center text-sm font-medium hidden"></div>
    </div>

    <!-- Hubungkan konfigurasi Supabase -->
    <script src="js/supabase-config.js"></script>

    <script>
        document.getElementById('formRegister').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nis = document.getElementById('regNis').value.trim();
            const nama = document.getElementById('regNama').value.trim();
            const suara = document.getElementById('regSuara').value;
            const password = document.getElementById('regPassword').value.trim();
            const pesanInfo = document.getElementById('pesanInfo');
            const btnRegister = document.getElementById('btnRegister');

            pesanInfo.classList.add('hidden');
            btnRegister.textContent = 'Mendaftarkan...';
            btnRegister.disabled = true;

            try {
                // Masukkan data ke tabel 'anggota' Supabase
                const { error } = await _supabase
                    .from('anggota')
                    .insert([
                        { nis: nis, nama_lengkap: nama, jenis_suara: suara, password: password, foto_ttd: '' }
                    ]);

                if (error) {
                    if (error.code === '23505') {
                        throw new Error('NIS tersebut sudah terdaftar di database!');
                    } else {
                        throw new Error(error.message);
                    }
                }

                pesanInfo.textContent = 'Pendaftaran berhasil! Mengalihkan ke halaman login...';
                pesanInfo.className = 'mt-4 text-center text-sm font-medium text-emerald-600';
                pesanInfo.classList.remove('hidden');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);

            } catch (err) {
                pesanInfo.textContent = 'Gagal: ' + err.message;
                pesanInfo.className = 'mt-4 text-center text-sm font-medium text-red-600';
                pesanInfo.classList.remove('hidden');
                btnRegister.textContent = 'Daftar ke Database';
                btnRegister.disabled = false;
            }
        });
    </script>
</body>
</html>
