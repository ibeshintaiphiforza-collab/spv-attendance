<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPV Attendance</title>
    <!-- Tailwind CSS untuk desain modern & responsif -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Kustom CSS Lokal -->
    <link rel="stylesheet" href="css/style.css">
    <!-- Pustaka Supabase Client dari CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-slate-800">SPV ATTENDANCE</h1>
            <p class="text-sm text-slate-500 mt-1">Saint Paul Voices - Presensi Digital</p>
        </div>

        <form id="formLogin" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Nomor Induk Siswa (NIS) / ID</label>
                <input type="text" id="nis" required 
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="Masukkan NIS Anda">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-2">Password</label>
                <input type="password" id="password" required 
                    class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
                    placeholder="••••••••">
            </div>

            <button type="submit" id="btnLogin"
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-lg transition duration-200 shadow-lg">
                Masuk Sistem
            </button>
        </form>

        <!-- Tautan Pendaftaran Anggota Baru -->
        <div class="mt-4 text-center">
            <p class="text-sm text-slate-600">Belum punya akun? <a href="register.html" class="text-indigo-600 font-semibold hover:underline">Daftar di sini</a></p>
        </div>

        <div id="pesanError" class="mt-4 text-center text-sm text-red-600 font-medium hidden"></div>
    </div>

    <!-- Hubungkan dengan file konfigurasi Supabase kita -->
    <script src="js/supabase-config.js"></script>
    
    <script>
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nisInput = document.getElementById('nis').value.trim();
            const passwordInput = document.getElementById('password').value.trim();
            const pesanError = document.getElementById('pesanError');
            const btnLogin = document.getElementById('btnLogin');

            pesanError.classList.add('hidden');
            btnLogin.textContent = 'Memeriksa...';
            btnLogin.disabled = true;

            try {
                // Cek data ke tabel 'anggota' di Supabase
                const { data, error } = await _supabase
                    .from('anggota')
                    .select('*')
                    .eq('nis', nisInput)
                    .single();

                if (error || !data) {
                    throw new Error('NIS atau ID tidak ditemukan!');
                }

                // Periksa password
                if (data.password !== passwordInput) {
                    throw new Error('Password salah!');
                }

                // Simpan data sesi ke browser (localStorage)
                localStorage.setItem('user_nis', data.nis);
                localStorage.setItem('user_nama', data.nama_lengkap);
                localStorage.setItem('user_suara', data.jenis_suara);

                // Periksa apakah akun Pelatih / Admin atau Siswa biasa
                if (data.nis === 'admin' || data.jenis_suara === 'Pelatih') {
                    alert('Login Berhasil! Selamat datang di Panel Pelatih.');
                    window.location.href = 'dashboard_pelatih.html';
                } else {
                    alert('Login Berhasil, Selamat datang ' + data.nama_lengkap + '!');
                    window.location.href = 'dashboard_anggota.html';
                }

            } catch (err) {
                pesanError.textContent = err.message;
                pesanError.classList.remove('hidden');
                btnLogin.textContent = 'Masuk Sistem';
                btnLogin.disabled = false;
            }
        });
    </script>
</body>
</html>
